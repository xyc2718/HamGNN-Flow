# HamGNN工作流调度系统配置文件

# 工作流基本配置
workflow:
  base_work_dir: "/home/user/hamgnn/workdir"  # 工作目录基础路径
  log_level: "INFO"                           # 日志级别
  cleanup: false                               # 是否清理工作目录
  cleanup_completed_tasks_interval: 360.0    # 清理已完成任务的scfout,npz,npy文件的间隔
  cleanup_suffixes:
    - ".scfout"                               # 清理的文件后缀列表
    - ".npz"
    - ".npy"
    - ".xyz"
    - ".UCell"
    - ".std"
    - ".input"
  task_maintenance: true                  # 是否启用任务维护功能
  task_maintenance_interval: 3000.0         # 任务维护间隔（秒）
  stuck_task_threshold: 3600.0                # 卡住任务的阈值（秒），默认1小时
  

# 定时任务运行间隔配置（单位：秒）
periodic_tasks:
  dispatch_openmx_interval: 2.0              # F1任务：提交openmx作业的检查间隔
  poll_slurm_interval: 4.0                  # F2任务：轮询Slurm作业状态的间隔
  dispatch_hamgnn_interval: 4.0               # F3任务：AI模型推理任务的检查间隔
  dispatch_postprocess_interval: 2.0         # F4任务：提交后处理作业的检查间隔
  update_partition_interval: 0.5          # F5任务：更新Slurm分区的检查间隔

# 各处理阶段的并发限制
concurrency:
  max_openmx_jobs: 64                         # 同时运行的openmx作业最大数量
  max_hamgnn_jobs: 24                          # 同时运行的AI推理任务最大数量
  max_hamgnn_batch_size: 8                    #单次提交AI推理任务的批量大小
  max_postprocess_jobs: 64                    # 同时运行的后处理作业最大数量


# 故障恢复配置
recovery:
  auto_restart_failed_jobs: true              # 自动重启失败的作业
  max_retries: 1                              # 最大重试次数
  retry_delay: 300                            # 重试延迟（秒）

# 系统监控配置
monitoring:
  collect_metrics: true                       # 是否收集系统指标
  metrics_interval: 60                        # 指标收集间隔（秒）
  queue_length_warning: 50                    # 队列长度警告阈值

default_parameters:
  partition: "auto"
  default_partition :
    - "chu"
    - "xu"
    - "yang"
    - "xiang"
  excluded_partitions:
    - "8-4090"
    - "4v100"